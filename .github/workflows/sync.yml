name: Sync to Fandom Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - 'scripts/**'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mwclient

      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.FANDOM_USERNAME }}" ]; then
            echo "Error: FANDOM_USERNAME is not set in GitHub Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.FANDOM_PASSWORD }}" ]; then
            echo "Error: FANDOM_PASSWORD is not set in GitHub Secrets."
            exit 1
          fi

      - name: Run sync script
        env:
          FANDOM_USERNAME: ${{ secrets.FANDOM_USERNAME }}
          FANDOM_PASSWORD: ${{ secrets.FANDOM_PASSWORD }}
        run: python scripts/sync_to_fandom.py
