name: Sync to Fandom Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - 'scripts/**'
  workflow_dispatch: # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so tj-actions/changed-files can compare

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mwclient

      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.FANDOM_USERNAME }}" ]; then
            echo "Error: FANDOM_USERNAME is not set in GitHub Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.FANDOM_PASSWORD }}" ]; then
            echo "Error: FANDOM_PASSWORD is not set in GitHub Secrets."
            exit 1
          fi

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            wiki/**/*.md
          write_output_files: true

      - name: Run sync script
        env:
          FANDOM_USERNAME: ${{ secrets.FANDOM_USERNAME }}
          FANDOM_PASSWORD: ${{ secrets.FANDOM_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python scripts/sync_to_fandom.py --all
          else
            python scripts/sync_to_fandom.py --file .github/outputs/all_changed_files.txt
          fi
